[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmem"
version = "0.1.0"
description = "长交互式AI记忆系统 harness —— 面向 LongMemEval 的记忆中间层（GLM-5.3 / GLM-5.3-Flash 双模型）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
ui = ["gradio>=4.40"]
dev = ["pytest>=8.0"]

[project.scripts]
lmem = "lmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
